name: CI Basics

on:
  push:
    branches:
      - devopslab
  pull_request:
    branches:
      - devopslab

# ------------------------
# Stage 1: Build + Sonar
# ------------------------
jobs:
  build_sonar:
    name: 🏗️ Build & Sonar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: 💾 Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 🏗️ Maven build & Sonar scan
        working-directory: app/s3buket
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=pavan-devops-lab \
          -Dsonar.host.url=$SONAR_HOST_URL \
          -Dsonar.login=$SONAR_TOKEN


# ------------------------
# Stage 2: Docker Build (ONCE)
# ------------------------
  docker_build:
    name: 🐳 Docker Build
    needs: build_sonar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🐳 Build Docker image
        run: |
          docker build -t s3bucket:latest app/s3buket

      - name: 📦 Save Docker image
        run: |
          docker save s3bucket:latest -o s3bucket.tar

      - name: ⬆ Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: s3bucket-image
          path: s3bucket.tar


# ------------------------
# Stage 3: Trivy Scan
# ------------------------
  trivy_scan:
    name: 🔎 Trivy Security Scan
    needs: docker_build
    runs-on: ubuntu-latest

    steps:
      - name: ⬇ Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: s3bucket-image

      - name: 🐳 Load Docker image
        run: |
          docker load -i s3bucket.tar

      - name: 🔎 Trivy image scan (monitoring mode)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: s3bucket:latest
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL


# ------------------------
# Stage 4: Publish Image
# ------------------------
  publish:
    name: 📦 Publish Docker Image
    needs: trivy_scan
    runs-on: ubuntu-latest

    steps:
      - name: ⬇ Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: s3bucket-image

      - name: 🐳 Load Docker image
        run: |
          docker load -i s3bucket.tar

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏷 Tag image with commit id
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "Using image tag: $SHORT_SHA"
          docker tag s3bucket:latest ${{ secrets.DOCKER_USERNAME }}/s3bucket:$SHORT_SHA
          docker tag s3bucket:latest ${{ secrets.DOCKER_USERNAME }}/s3bucket:latest

      - name: 📤 Push Docker image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker push ${{ secrets.DOCKER_USERNAME }}/s3bucket:$SHORT_SHA
          docker push ${{ secrets.DOCKER_USERNAME }}/s3bucket:latest
