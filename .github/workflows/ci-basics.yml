name: CI Basics

on:
  push:
    branches:
      - devopslab
  pull_request:
    branches:
      - devopslab

jobs:
  build:
    name: Basic CI Job with Sonar
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Workflow started
        run: echo "CI pipeline started on $(date)"

      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📂 Show repository structure (root)
        run: |
          echo "Current directory:"
          pwd
          echo "Root files:"
          ls -la

      - name: 📂 Show app folder structure
        run: |
          echo "Listing app folder:"
          ls -la app

      - name: 🔍 Check installed tools
        run: |
          echo "Git version:"
          git --version
          echo "Bash version:"
          bash --version

      - name: ☕ Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: ☕ Verify Java & Maven
        run: |
          echo "Java version:"
          java -version
          echo "Maven version:"
          mvn -version

      - name: 💾 Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: 💾 Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 🏗️ Build & Sonar analysis started
        working-directory: app/s3buket
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          echo "Running Maven build from app directory..."
          pwd
          ls -la
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=pavan-devops-lab \
          -Dsonar.host.url=$SONAR_HOST_URL \
          -Dsonar.login=$SONAR_TOKEN

      - name: 📄 Verify Sonar report file
        run: |
          echo "Checking if report-task.txt exists..."
          ls -la app/.scannerwork || echo ".scannerwork folder not found"
          cat app/.scannerwork/report-task.txt || echo "report-task.txt not found"

      - name: 🚦 SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          scanMetadataReportFile: app/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: ✅ Workflow finished
        run: echo "CI pipeline completed at $(date)"
