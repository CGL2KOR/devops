name: CI Basics

on:
  push:
    branches:
      - devopslab
  pull_request:
    branches:
      - devopslab

# ------------------------
# Stage 1: Build + Sonar
# ------------------------
jobs:
  build_sonar:
    name: 🏗️ Build & Sonar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: 💾 Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: 🏗️ Maven build & Sonar scan
        working-directory: app/s3buket
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=pavan-devops-lab \
          -Dsonar.host.url=$SONAR_HOST_URL \
          -Dsonar.login=$SONAR_TOKEN


# ------------------------
# Stage 2: Docker Build
# ------------------------
  docker_build:
    name: 🐳 Docker Build
    needs: build_sonar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build Docker image
        run: |
          docker build -t s3bucket:latest app/s3buket


# ------------------------
# Stage 3: Trivy Scan
# ------------------------
  trivy_scan:
    name: 🔎 Trivy Security Scan
    needs: docker_build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🐳 Build image again for scan
        run: |
          docker build -t s3bucket:latest app/s3buket

      - name: 🔎 Trivy image scan (monitoring mode)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: s3bucket:latest
          format: table
          exit-code: 0          # ✅ NEVER fail pipeline
          severity: HIGH,CRITICAL

