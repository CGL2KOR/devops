name: CI Basics

on:
 push:
  branches:
    - devopslab
  pull_request:
    branches:
      - develop

jobs:
  build:
    name: Basic CI Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Show repository structure
        run: |
          pwd
          ls -la
      - name: Check installed tools
        run: |
          git --version
          bash --version
