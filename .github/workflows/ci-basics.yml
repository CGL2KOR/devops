name: CI Basics

on:
  push:
    branches:
      - devopslab
  pull_request:
    branches:
      - devopslab

jobs:
  build:
    name: Build, Scan & Dockerize
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Workflow started
        run: echo "CI pipeline started on $(date)"

      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: ☕ Verify Java & Maven
        run: |
          java -version
          mvn -version

      - name: 💾 Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # ------------------------
      # Build + Sonar
      # ------------------------
      - name: 🏗️ Maven build & Sonar scan
        working-directory: app/s3buket
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=pavan-devops-lab \
          -Dsonar.host.url=$SONAR_HOST_URL \
          -Dsonar.login=$SONAR_TOKEN

      # ------------------------
      # Docker build
      # ------------------------
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build Docker image
        run: |
          docker build -t s3bucket:latest app/s3buket

      # ------------------------
      # Trivy scan
      # ------------------------
      - name: 🔎 Trivy image scan (HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: s3bucket:latest
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: ✅ Pipeline completed
        run: echo "CI pipeline completed at $(date)"
